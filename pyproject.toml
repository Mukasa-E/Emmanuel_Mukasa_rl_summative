[project]
name = "emmanuel_mukasa_rl_summative"
version = "0.1.0"
description = "Mission-based Reinforcement Learning summative assignment: precision-agriculture field navigation with DQN, REINFORCE, PPO and A2C (TorchRL)."
requires-python = ">=3.10,<3.13"
authors = [{ name = "Emmanuel Mukasa" }]
readme = "README.md"

dependencies = [
    "torch>=2.1,<2.6",
    "torchrl>=0.4,<0.7",
    "gymnasium>=0.29,<1.0",
    "numpy>=1.24,<2.3",
    "matplotlib>=3.8,<3.10",
    "pygame>=2.5,<2.7",
    "tensorboard>=2.14,<2.18",
    "tqdm>=4.66,<4.70",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "black>=24.0,<25.0",
    "ruff>=0.6,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]
